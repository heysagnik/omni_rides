name: user_app
description: "Consumer ride-hailing application"
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_fonts: ^8.2.1
  firebase_auth: ^6.6.0
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.4
  http: ^1.6.0
  geolocator: ^14.0.3
  firebase_core: ^4.5.0
  flutter_svg: ^2.0.10+1
  flutter_dotenv: ^6.0.0
  firebase_messaging: ^16.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.0
  share_plus: ^13.2.0
  google_maps_flutter: ^2.9.0
  flutter_secure_storage: ^11.0.0
  phosphoricons_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_launcher.png"
  adaptive_icon_background: "#1C683C"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_icon.png
    - assets/images/app_icon_launcher.png
    - assets/images/auto-rickshaw.png
    - assets/images/car-sedan.png
    - assets/images/car-suv.png
    - assets/images/motorcycle.png
    - assets/images/package.png
